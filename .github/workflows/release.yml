name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      # npm Trusted Publishing requires Node >= 22.14 and npm >= 11.5.1.
      # Do not configure registry-url: it injects NODE_AUTH_TOKEN and prevents OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: OIDC preflight
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC is unavailable; check the id-token: write permission."
            exit 1
          fi

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "frame-master-plugin-cloudflare-pages-dynamic-ssr@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via OIDC
        if: steps.check.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          unset NODE_AUTH_TOKEN
          VERSION="${{ steps.pkg.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi

      - name: Create git tag
        if: steps.check.outputs.published == 'false'
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
